<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>Redirect a innovazione.gov.it</title>
    <meta http-equiv="refresh" content="0; URL=https://innovazione.gov.it" />
    <script>
      // Fallback JS redirect
      window.location.replace("https://innovazione.gov.it");
    </script>
  </head>
  <body>
    <p>
      Stai per essere reindirizzato a
      <a href="https://innovazione.gov.it">innovazione.gov.it</a>.
      Se il redirect non avviene automaticamente, clicca sul link.
    </p>
  </body>
</html>
